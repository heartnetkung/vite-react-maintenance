<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }

    .container {
      text-align: center;
      max-width: 800px;
      padding: 40px 24px;
    }

    .illustration {
      width: 280px;
      height: 280px;
      margin: 0 auto 32px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 8px;
    }

    .subtext {
      font-size: 0.95rem;
      color: #888;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="illustration" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <!-- Background circle -->
      <circle cx="140" cy="140" r="130" fill="#ffeaa7" opacity="0.4"/>

      <!-- Hard hat -->
      <ellipse cx="140" cy="88" rx="52" ry="16" fill="#e17055"/>
      <path d="M88 88 Q88 50 140 42 Q192 50 192 88" fill="#fdcb6e" stroke="#e17055" stroke-width="3"/>
      <rect x="82" y="84" width="116" height="10" rx="4" fill="#fdcb6e" stroke="#e17055" stroke-width="2"/>
      <rect x="130" y="42" width="20" height="8" rx="4" fill="#e17055"/>

      <!-- Character body -->
      <rect x="115" y="98" width="50" height="60" rx="8" fill="#74b9ff"/>
      <rect x="110" y="98" width="60" height="20" rx="6" fill="#74b9ff"/>

      <!-- Face -->
      <circle cx="140" cy="78" r="6" fill="transparent"/>
      <circle cx="128" cy="80" r="3" fill="#2d3436"/>
      <circle cx="152" cy="80" r="3" fill="#2d3436"/>
      <path d="M132 90 Q140 96 148 90" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Arms -->
      <line x1="115" y1="108" x2="80" y2="130" stroke="#74b9ff" stroke-width="10" stroke-linecap="round"/>
      <line x1="165" y1="108" x2="200" y2="130" stroke="#74b9ff" stroke-width="10" stroke-linecap="round"/>

      <!-- Wrench in right hand -->
      <g transform="translate(200,130) rotate(45)">
        <rect x="-4" y="-30" width="8" height="40" rx="3" fill="#636e72"/>
        <circle cx="0" cy="-30" r="12" fill="none" stroke="#636e72" stroke-width="6"/>
        <rect x="-3" y="-42" width="6" height="12" fill="#636e72"/>
      </g>

      <!-- Legs -->
      <rect x="120" y="155" width="16" height="40" rx="6" fill="#2d3436"/>
      <rect x="144" y="155" width="16" height="40" rx="6" fill="#2d3436"/>

      <!-- Boots -->
      <ellipse cx="128" cy="198" rx="14" ry="7" fill="#636e72"/>
      <ellipse cx="152" cy="198" rx="14" ry="7" fill="#636e72"/>

      <!-- Gear 1 -->
      <g transform="translate(50, 200)">
        <circle cx="0" cy="0" r="20" fill="none" stroke="#b2bec3" stroke-width="6"/>
        <circle cx="0" cy="0" r="8" fill="#dfe6e9"/>
        <rect x="-3" y="-26" width="6" height="12" rx="2" fill="#b2bec3"/>
        <rect x="-3" y="14" width="6" height="12" rx="2" fill="#b2bec3"/>
        <rect x="-26" y="-3" width="12" height="6" rx="2" fill="#b2bec3"/>
        <rect x="14" y="-3" width="12" height="6" rx="2" fill="#b2bec3"/>
        <rect x="13" y="-19" width="6" height="12" rx="2" fill="#b2bec3" transform="rotate(45 16 -13)"/>
        <rect x="-19" y="13" width="6" height="12" rx="2" fill="#b2bec3" transform="rotate(45 -16 19)"/>
        <rect x="13" y="13" width="6" height="12" rx="2" fill="#b2bec3" transform="rotate(-45 16 19)"/>
        <rect x="-19" y="-19" width="6" height="12" rx="2" fill="#b2bec3" transform="rotate(-45 -16 -13)"/>
      </g>

      <!-- Gear 2 -->
      <g transform="translate(230, 210)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#b2bec3" stroke-width="5"/>
        <circle cx="0" cy="0" r="5" fill="#dfe6e9"/>
        <rect x="-2.5" y="-20" width="5" height="10" rx="2" fill="#b2bec3"/>
        <rect x="-2.5" y="10" width="5" height="10" rx="2" fill="#b2bec3"/>
        <rect x="-20" y="-2.5" width="10" height="5" rx="2" fill="#b2bec3"/>
        <rect x="10" y="-2.5" width="10" height="5" rx="2" fill="#b2bec3"/>
      </g>

      <!-- Cone -->
      <g transform="translate(220, 160)">
        <polygon points="0,-30 -15,0 15,0" fill="#fdcb6e" stroke="#e17055" stroke-width="2"/>
        <rect x="-18" y="-2" width="36" height="6" rx="2" fill="#e17055"/>
        <rect x="-8" y="-20" width="16" height="4" rx="1" fill="#fff" opacity="0.6"/>
        <rect x="-12" y="-12" width="24" height="4" rx="1" fill="#fff" opacity="0.6"/>
      </g>
    </svg>

    <h1>We'll Be Right Back!</h1>
    <p>We're currently performing planned engineering work to improve your experience.</p>
    <p>Everything will be back to normal shortly.</p>
    <p class="subtext">Thank you for your patience.</p>
  </div>
</body>
</html>
